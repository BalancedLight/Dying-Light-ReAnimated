name: C# rewrite

on:
  push:
    branches:
      - main
      - refactor
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    # The packaged acceptance gate exercises an offscreen WPF/D3D11 window.
    # Keep it on the stable Windows Server 2022 desktop image instead of
    # inheriting windows-latest's Windows Server/Visual Studio migrations.
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out C# repository
        uses: actions/checkout@v7
        with:
          path: csharp

      - name: Check out Python oracle
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          path: python-oracle
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: csharp/global.json

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-oracle/pyproject.toml

      - name: Install Python oracle
        shell: powershell
        working-directory: python-oracle
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev,gui]"
          if ($LASTEXITCODE -ne 0) {
            throw "The setup-python interpreter dependency install failed."
          }

          # validate_dl1_parity.ps1 prefers the Windows py launcher when it
          # exists. Hosted images can resolve that launcher to a different
          # Python than the setup-python PATH entry, so make its only external
          # dependency available there too.
          $launcher = Get-Command py -ErrorAction SilentlyContinue
          if ($null -ne $launcher) {
            $setupPython = ((python -c `
              "import os,sys; print(os.path.normcase(os.path.realpath(sys.executable)))") `
              -join "").Trim()
            $launcherPython = ((& $launcher.Source -3 -c `
              "import os,sys; print(os.path.normcase(os.path.realpath(sys.executable)))") `
              -join "").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "The Windows Python launcher could not resolve Python 3."
            }
            if ($launcherPython -ne $setupPython) {
              & $launcher.Source -3 -m pip install `
                --disable-pip-version-check "numpy>=1.24"
              if ($LASTEXITCODE -ne 0) {
                throw "The parity-launcher NumPy install failed."
              }
            }
          }

      - name: Build, test, validate, and package
        shell: powershell
        working-directory: csharp
        run: .\package_csharp.ps1 -OutputRoot artifacts\csharp -PythonOracleRoot ..\python-oracle -SkipUnavailableOptionalBlenderOracle

      - name: Upload WPF validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: CSharp-wpf-validation-diagnostics
          path: |
            csharp/artifacts/validation/.wpf-startup-stage-*
            csharp/artifacts/validation/dl1-wpf-startup-smoke.json
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload validated Windows package
        uses: actions/upload-artifact@v7
        with:
          name: DL-ReAnimated-CSharp-win-x64
          path: |
            csharp/artifacts/csharp/win-x64/DLReAnimated.exe
            csharp/artifacts/csharp/DL-ReAnimated-CSharp-win-x64.zip
            csharp/artifacts/csharp/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CSharp-test-results
          path: csharp/tests/ReAnimated.Tests/TestResults
          if-no-files-found: warn
